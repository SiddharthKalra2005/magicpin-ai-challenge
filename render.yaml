services:
  - type: web
    name: vera-magicpin
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    plan: free
    # Single instance — this service holds all conversation/context/suppression
    # state in-process (no external store). More than 1 instance or worker
    # would split state across processes and break the judge harness.
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
